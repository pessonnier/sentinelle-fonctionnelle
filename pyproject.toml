[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelle-fonctionnelle"
version = "0.1.0.dev0"
description = "Conception et exécution contrôlées de tests fonctionnels"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.116,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
]

[project.scripts]
sentinelle-fonctionnelle = "sentinelle_fonctionnelle.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinelle_fonctionnelle = [
    "web/static/*.css",
    "web/templates/*.html",
]
