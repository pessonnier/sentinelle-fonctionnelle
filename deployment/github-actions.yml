name: functional-tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sentinelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p artifacts && sudo chown 10001:10001 artifacts
      - name: Verify and run approved bundle without PR secrets
        run: >-
          docker run --rm --user=10001:10001 --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --pids-limit=256 --memory=2g --cpus=2
          --tmpfs /tmp:rw,noexec,nosuid,size=512m
          -v "$PWD/sentinelle-bundle:/bundle:ro"
          -v "$PWD/artifacts:/artifacts:rw"
          sentinelle-fonctionnelle-runner:0.1.0
          --bundle /bundle --artifacts /artifacts
          --base-url "$TARGET_BASE_URL" --allow-origin "$TARGET_BASE_URL"
          --declaration on_merge_request
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinelle-results
          path: artifacts/
