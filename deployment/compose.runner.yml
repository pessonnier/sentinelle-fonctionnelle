name: sentinelle-functional
services:
  design:
    build:
      context: ..
      dockerfile: deployment/application.Dockerfile
    image: sentinelle-fonctionnelle:0.1.0
    user: "10000:10000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - design-data:/var/lib/sentinelle:rw
    ports:
      - 127.0.0.1:8000:8000
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  runner:
    profiles: [run]
    build:
      context: ..
      dockerfile: deployment/runner.Dockerfile
    image: sentinelle-fonctionnelle-runner:0.1.0
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    volumes:
      - ../sentinelle-bundle:/bundle:ro
      - ../artifacts:/artifacts:rw
    environment:
      TARGET_BASE_URL: ${TARGET_BASE_URL:-http://target-demo:8000}
    command:
      - --bundle
      - /bundle
      - --artifacts
      - /artifacts
      - --base-url
      - ${TARGET_BASE_URL:-http://target-demo:8000}
      - --allow-origin
      - ${TARGET_BASE_URL:-http://target-demo:8000}
    networks: [test-only]

  target-demo:
    profiles: [run]
    image: sentinelle-fonctionnelle:0.1.0
    user: "10000:10000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /var/lib/sentinelle:rw,noexec,nosuid,size=128m
    command: [serve, --host, 0.0.0.0, --database, /var/lib/sentinelle/demo.db]
    networks: [test-only]

networks:
  test-only:
    internal: true

volumes:
  design-data:
